<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .d-none{
            display: none;
        }
    </style>
</head>
<body>
    <div id="clock"></div>

    <div id="timer-container">
        <h1 id="timer"></h1>
        <button id="startBtn">Start timer</button>
        <button id="stopBtn">Stop timer</button>
    </div>

    <!-- when i click on this button it should toggle the class d-none in timer-container
     and stop the timer when the element is not on the screen -->
    <button id="toggle">Toggle</button>


    <script src="script.js"></script>
</body>
</html>
