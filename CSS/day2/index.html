<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 300px;
            width: 300px;
            background-color: pink;
            padding: 20px;
            border: 10px solid black;

            /* margin: 30px; */

            box-sizing: border-box;
            /* box-sizing: content-box; */
        }
        .box2{
            height: 300px;
            width: 300px;
            background-color: red;
        }
        /* content-box: the final size depends on the padding and border
            (its added outside the box)

            border-box: the final size includes the padding and border
        */










        
        /* 
        content: things inside the box
        padding: space b/w content and border
        border: the line surrounding padding and content
        margin: space outside the border 
         */
         button{
            font-size: 16px;
            font-weight: 600;
            border-radius: 20px;
            /* how to make circle using css */
            /* border-radius: 50%; */
            padding: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
         }



         .box3{
            height: 300px;
            width: 100px;
            background-color: pink;
            /* display: block; */
            /* display: inline; */
            /* display: none; */
            display: inline-block;
            margin-right: 20px;
            padding: 50px;
         }

         /* display: block;
            starts on a new line, takes full width by default,
            width and height can be set

            display: inline;
            stays in the same line, width and height does not apply,
            used for short peices of text

            display: inline-block;
            stays in line and you can assign height and width

            display: none;
            remove from DOM
         */



        .parent{
            height: 300px;
            width: 300px;
            background-color: pink;
            position: relative;
            /* z-index: 1000; */
            /* top: 100px; */
            /* bottom: ; */
            /* left: 100px; */
            /* right: ; */
        }
        .child{
            background-color: red;
            height: 100px;
            width: 100px;
            position: absolute;
            left: 100px;
            top: 100px;
        }

        /* position static: default value, element stays in normal position
           position relative: element moves relative to its normal position (original position is reserved)
           position absolute: element moves relative to its nearest parent  (original space is removed)
           positon fixed: stays on the same place while scrolling
           position sticky: scrolls to a fixed position while scrolling
        */

        :root{
            --primary-color: #007bff;
            --text-color: #333;
            --card-radius: 12px;
            --spacing: 16px;
        }

        button{
            padding: var(--spacing);
            background-color: var(--primary-color);
        }

    </style>
</head>
