<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    action : specifies where you want to redirect or send the details of the form
    method: specifies how you want to send the detials
    -->

    <button>Click Me</button>

    <form action="" method="" >

        <label for="student-details">Enter student details:</label>
        <input type="text" name="" id="student-details" placeholder="text input" required>
        <br>

        <label for="dob">Enter student DOB:</label>
        <input type="date" name="" id="dob" >
        <br>

        <label for="age">Student Age:</label>
        <input type="number" name="age" id="age" placeholder="number input">
        <br>

        <label for="email">Student Email:</label>
        <input type="email" name="" id="email" placeholder="enter email">
        <br>

        <label for="password">Password: </label>
        <input type="password" name="" id="password" placeholder="enter password">
        
        <input type="color" name="" id="">


        <!-- the name should be same for the set of checkboxes and radios -->
        <label>
            <input type="checkbox" value="JS" name="skills">
            JS
        </label>

        <label>
            <input type="checkbox" value="HTML" name="skills">
            HTML
        </label>

        <label>
            <input type="checkbox" value="CSS" name="skills">
            CSS
        </label>


        <p>Select Batch</p>

        <label>
            <input type="radio" name="batch" id="" value="morning">
            Morning
        </label>
        <label>
            <input type="radio" name="batch" id="" value="afternoon">
            Afternoon
        </label>
        <label>
            <input type="radio" name="batch" id="" value="evening">
            Evening
        </label>

        <br>

        <p>Select your city</p>
        <select name="city">
            <option value="" hidden>Select your city</option>
            <option value="Pune">Pune</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Nagpur">Nagpur</option>
        </select>

        <br>

        <textarea id="" name="" rows="4" cols="50"></textarea>

        <input type="file" name="" id="" placeholder="file input">

   
        <button type="submit">Submit</button>

    </form>


    <p>Hello i am <b>Pranav</b> </p>
    <p>Hello i am <strong>Pranav</strong> </p>
    
    <p> <i>Hello</i> i am <strong>Pranav</strong>  </p>


    <span>asdasd</span>
    <span>onlkmlkm</span>




</body>
</html>
